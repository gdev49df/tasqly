name = "tasqly"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# статика (pwa) отдаётся напрямую, воркер запускается только для /api/*
[assets]
directory = "./public"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# свой домен: cloudflare сам создаст dns-запись (зона w-smp.in должна быть в этом аккаунте)
routes = [
  { pattern = "tasqly.w-smp.in", custom_domain = true },
]

# сайты, которым разрешено ходить в api (через запятую)
[vars]
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "tasqly"
database_id = "662c5b62-87e0-4ddd-80d0-bc426cad032b"

# ai tasqly: cloudflare workers ai (ключ не нужен)
[ai]
binding = "AI"
