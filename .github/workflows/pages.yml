name: pages

# сайт живёт на одном адресе: https://tasqly.wsmp.workers.dev/
# на github pages остаётся только страница-переадресация, чтобы старая ссылка не ломалась
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: собрать статику
        run: |
          mkdir _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>tasqly</title>
          <meta http-equiv="refresh" content="0; url=https://tasqly.wsmp.workers.dev/">
          <link rel="canonical" href="https://tasqly.wsmp.workers.dev/">
          <script>location.replace('https://tasqly.wsmp.workers.dev/' + location.hash)</script>
          <a href="https://tasqly.wsmp.workers.dev/">tasqly</a>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
