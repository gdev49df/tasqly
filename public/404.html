<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>страница не найдена · tasqly</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#c6f432">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("tq_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf { min-height: calc(100vh - 80px); display: grid; place-content: center; justify-items: center; gap: 14px; padding: 40px 20px; text-align: center; }
    .nf .logo-mark { width: 44px; height: 44px; color: var(--accent); }
    .nf-code { font-size: clamp(88px, 22vw, 168px); font-weight: 800; letter-spacing: -0.06em; line-height: 1; margin: 6px 0 0; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 35%, var(--text))); -webkit-background-clip: text; background-clip: text; color: transparent; animation: tq-page .5s var(--ease-out); }
    .nf h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0; }
    .nf p { color: var(--muted); max-width: 380px; margin: 0; line-height: 1.55; }
    .nf-cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    @media (prefers-reduced-motion: reduce) { .nf-code { animation: none; } }
  </style>
</head>
<body>
  <main class="nf">
    <a href="/" aria-label="tasqly">
      <svg class="logo-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="currentColor"/><g fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round"><circle cx="240" cy="231" r="104"/><path d="M344 140v245"/></g></svg>
    </a>
    <div class="nf-code" aria-hidden="true">404</div>
    <h1>страница не найдена</h1>
    <p>такой страницы нет: возможно, ссылка устарела или в адресе опечатка.</p>
    <div class="nf-cta">
      <a class="btn big" href="/">на главную</a>
      <a class="btn ghost big" href="/panel/">в кабинет</a>
    </div>
  </main>
  <footer class="footer">Создано @bauyrzhanov_12_</footer>
</body>
</html>
