<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>страница не найдена · tasqly</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#c6f432">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("tq_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { overflow-x: hidden; }
    .nf { position: relative; min-height: calc(100vh - 80px); display: grid; place-content: center; justify-items: center; gap: 14px; padding: 40px 20px; text-align: center; }
    .nf::before { content: ''; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(color-mix(in srgb, var(--text) 16%, transparent) 1px, transparent 1.4px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(ellipse 55% 50% at 50% 48%, #000, transparent 75%); mask-image: radial-gradient(ellipse 55% 50% at 50% 48%, #000, transparent 75%); }
    .nf .logo { font-size: 24px; margin-bottom: 18px; }
    .nf-code { display: flex; align-items: center; justify-content: center; gap: clamp(2px, 1vw, 10px); font-size: clamp(110px, 26vw, 210px); font-weight: 800; letter-spacing: -0.06em; line-height: .9; margin: 0; color: var(--text); animation: tq-page .5s var(--ease-out); }
    .nf-code i { font-style: normal; display: inline-grid; place-items: center; width: .66em; height: .66em; border-radius: 50%; background: var(--lime); color: var(--lime-ink); font-size: 1em; position: relative; animation: nf-float 4s ease-in-out infinite; }
    .nf-code i::after { content: ':('; position: absolute; font-size: .2em; letter-spacing: 0; font-weight: 700; transform: rotate(90deg); }
    .nf h1 { font-size: 24px; letter-spacing: -0.03em; margin: 10px 0 0; font-weight: 650; }
    .nf p { color: var(--muted); max-width: 380px; margin: 0; line-height: 1.55; }
    .nf-cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    @keyframes nf-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .nf-code, .nf-code i { animation: none; } }
  </style>
</head>
<body>
  <main class="nf">
    <a class="logo" href="/" aria-label="tasqly"><span class="logo-word">tasqly</span></a>
    <div class="nf-code" aria-hidden="true">4<i></i>4</div>
    <h1>страница не найдена</h1>
    <p>такой страницы нет: возможно, ссылка устарела или в адресе опечатка.</p>
    <div class="nf-cta">
      <a class="btn big" href="/">на главную</a>
      <a class="btn ghost big" href="/panel/">в кабинет</a>
    </div>
  </main>
</body>
</html>
